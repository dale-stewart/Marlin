#
# Marlin Firmware
# PlatformIO Configuration File
#

#################################
#                               #
#      Native / Simulation      #
#                               #
#################################

#
# No supported Arduino libraries, base Marlin only
#
# Marlin as firmware for a Linux-based board. A real target, and the only thing HAL/LINUX
# is for. **No unit test environment may extend this.** Its peripherals are backed by real
# OS facilities — wall-clock time, POSIX timers, signals — which is right for a board and
# wrong for a test: a suite built on it cannot advance time, so every command that waits
# is unreachable, and the tests that could run took half an hour and were never run. It
# also went seven days without compiling before anyone noticed. Unit tests use HAL/TEST.
[env:linux_native]
platform         = native
framework        =
build_flags      = ${common.build_flags} -D__PLAT_LINUX__ -std=gnu++17 -ggdb -g -lrt -lpthread -D__MARLIN_FIRMWARE__ -Wno-expansion-to-defined
build_src_flags  = -Wall -IMarlin/src/HAL/LINUX/include
build_unflags    = -Wall -fsingle-precision-constant
lib_ldf_mode     = off
build_src_filter = ${common.default_src_filter} +<src/HAL/LINUX>

# Scaffolding shared by every unit-test environment: PlatformIO's Unity, plus the script
# that turns the files under Marlin/tests into one build target per configuration in test/.
#
# Deliberately HAL-free. Unit tests build against HAL/TEST and nothing else — see the note
# on `env:linux_native` above — so no test environment may descend from a HAL environment,
# which is what let a test suite be built against the wall clock in the first place.
[native_unit_test]
platform         = native
framework        =
build_unflags    = -Wall -fsingle-precision-constant
lib_ldf_mode     = off
extra_scripts    = ${common.extra_scripts}
                   post:buildroot/share/PlatformIO/scripts/collect-code-tests.py
lib_deps         = throwtheswitch/Unity@^2.6.0
test_build_src   = true

# Unit tests against the test HAL: a clock that only advances when a test says so, and
# timers that are state rather than POSIX signals. Commands that wait for hardware —
# G4, M400, M109, homing — complete deterministically here. See Marlin/src/HAL/TEST/.
[env:testhal_native_test]
extends          = native_unit_test
build_flags      = ${common.build_flags} -D__PLAT_TEST__ -std=gnu++17 -ggdb -g -lrt -lpthread -D__MARLIN_FIRMWARE__ -Wno-expansion-to-defined -Werror -DNO_USER_FEEDBACK_WARNING
build_src_flags  = -Wall -IMarlin/src/HAL/TEST/include
build_src_filter = ${common.default_src_filter} +<src/HAL/TEST> +<tests>

# Same as testhal_native_test but instrumented for gcov. This is the environment that
# measures Phase 4a: the behaviours it unblocked (motion, dwelling, waiting, arcs) only
# run here, so coverage of stepper.cpp and the blocking command path is only visible
# from this build.
[env:testhal_native_coverage]
extends     = env:testhal_native_test
build_flags = ${env:testhal_native_test.build_flags} --coverage -fprofile-abs-path -O0 -lgcov

# The suite under AddressSanitizer.
#
# Coverage says a line ran and mutation says a test noticed; neither says the suite is
# reading memory it owns. A dangling peripheral pointer or a one-byte buffer handed to a
# parser that writes in place corrupts something quietly and shows up later as an
# unrelated test crashing, hanging, or — worst — passing. Both of those existed here and
# were found by the first run of this environment.
#
# It is a separate env rather than a flag on the test env because it roughly triples the
# runtime and because a sanitizer abort is a different kind of failure from an assertion:
# it should be run deliberately, and read carefully.
[env:testhal_native_asan]
extends     = env:testhal_native_test
build_flags = ${env:testhal_native_test.build_flags} -fsanitize=address -fno-omit-frame-pointer -g -O0
build_unflags = -O2 -Os

# The acceptance suite (tests/gcode/features/*.feature) on its own, with the unit tests
# excluded. Measuring against only these shows how much of the behaviour the scenarios
# describe by themselves, which is what makes restructuring behind them safe.
# The filter is a positive list so new unit test files cannot creep into it.
# The acceptance suite on its own, with the unit tests excluded — the measurement Step 7 of
# legacy-rescue asks for: how much of the behaviour do the scenarios describe by themselves.
#
# It builds against HAL/TEST rather than HAL/LINUX. Under LINUX time is the wall clock, so a
# scenario cannot wait for the machine to arrive anywhere and nothing about motion is expressible
# — which quietly capped what the acceptance suite was allowed to be about. The support/ helpers
# come along because a scenario that says "the printer is homed" needs rails and switches to home
# against; they are fixtures, not tests, and no scenario reaches past them into the firmware.
[acceptance_only]
build_src_filter = ${common.default_src_filter} +<src/HAL/TEST>
                   +<tests/test> +<tests/support> +<tests/gcode/serial_capture.h>
                   +<tests/gcode/simulated_sensors.h> +<tests/gcode/test_gcode_acceptance.cpp>

[env:acceptance_native_test]
extends          = env:testhal_native_test
build_src_filter = ${acceptance_only.build_src_filter}

[env:acceptance_native_coverage]
extends          = env:testhal_native_coverage
build_src_filter = ${acceptance_only.build_src_filter}

#
# Native Simulation
# Builds with a small subset of available features
# Required system libraries: SDL2, SDL2-net, OpenGL, GLM
#   sudo apt-get install python3-venv build-essential libsdl2-dev libsdl2-net-dev libglm-dev
# See https://docs.platformio.org/en/latest/platforms/native.html for more information
#
# Tested with Linux (Mint 20) : gcc [9.3.0, 10.2.0]: libsdl2-dev[2.0.10], libsdl2-net-dev[2.0.1], libglm-dev[0.9.9.7, 0.9.9.8]
#
# For VSCode debugging see buildroot/share/PlatformIO/debugging/launch.json
#
[simulator_common]
platform          = native
framework         =
build_flags       = ${common.build_flags} -std=gnu++17
                    -I/usr/include/SDL2 -IMarlin -IMarlin/src/HAL/NATIVE_SIM/u8g
                    -D__PLAT_NATIVE_SIM__ -DU8G_HAL_LINKS -DGLM_ENABLE_EXPERIMENTAL
build_src_flags   = -Wall -Wno-expansion-to-defined -Wno-deprecated-declarations -Wcast-align
build_unflags     = -fsingle-precision-constant
release_flags     = -g0 -O3 -flto
debug_build_flags = -fstack-protector-strong -g -g3 -ggdb
lib_compat_mode   = off
build_src_filter  = ${common.default_src_filter} +<src/HAL/NATIVE_SIM>
lib_deps          = ${common.lib_deps}
                    MarlinSimUI=https://github.com/p3p/MarlinSimUI/archive/29c11d4f63.zip
                    Adafruit NeoPixel=https://github.com/p3p/Adafruit_NeoPixel/archive/c6b319f447.zip
                    LiquidCrystal=https://github.com/p3p/LiquidCrystal/archive/322fb5fc23.zip
extra_scripts     = ${common.extra_scripts}
                    pre:buildroot/share/PlatformIO/scripts/simulator.py

[simulator_linux]
extends     = simulator_common
build_flags = ${simulator_common.build_flags} -ldl -lpthread -lSDL2 -lSDL2_net -lGL

[env:simulator_linux_debug]
extends    = simulator_linux
build_type = debug

[env:simulator_linux_release]
extends     = simulator_linux
build_type  = release
build_flags = ${simulator_linux.build_flags} ${simulator_linux.release_flags}

#
# Simulator for macOS (MacPorts)
#

#
# Use the script buildroot/bin/mac_gcc to prepare your environment.
#
# MacPorts:
#  https://www.macports.org/install.php
#
#  sudo port install gcc14 glm mesa libsdl2 libsdl2_net
#
#  cd $(dirname "$(which port)")
#  sudo rm gcc g++ cc ld
#  sudo ln -s gcc-mp-14 gcc ; sudo ln -s g++-mp-14 g++ ; sudo ln -s g++ cc
#  sudo ln -s ld-classic ld
#  cd -
#  rehash
#
#==================================================================================
#
# Homebrew:
#  /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
#
#  brew install gcc@14 glm mesa sdl2 sdl2_net
#
#  cd "$(brew --prefix)/bin"
#  sudo rm -f gcc g++ cc
#  sudo ln -s gcc-14 gcc ; sudo ln -s g++-14 g++ ; sudo ln -s g++ cc
#  cd -
#

[simulator_macos]
build_unflags     = -g3 -lGL -fstack-protector-strong -fsingle-precision-constant
build_flags       = -g2
  -DHAS_LIBBSD
  -Wl,-framework,OpenGl
  -Wl,-framework,CoreFoundation
  -lSDL2
  -fno-stack-protector

[env:simulator_macos_debug]
extends         = env:simulator_linux_debug
build_flags     = ${env:simulator_linux_debug.build_flags} ${simulator_macos.build_flags} -ggdb -Og -D_THREAD_SAFE
build_unflags   = ${simulator_macos.build_unflags}
custom_verbose  = 0
custom_gcc      = g++

[env:simulator_macos_release]
extends         = env:simulator_linux_release
build_flags     = ${env:simulator_linux_release.build_flags} ${simulator_macos.build_flags}
build_unflags   = ${simulator_macos.build_unflags}
custom_verbose  = 0
custom_gcc      = g++

#
# Simulator for Windows 10
#
#  MSYS2 mingw-w64-x86_64 with these packages:
#   pacman -S --needed base-devel mingw-w64-x86_64-toolchain mingw64/mingw-w64-x86_64-glm mingw64/mingw-w64-x86_64-SDL2 mingw64/mingw-w64-x86_64-SDL2_net mingw-w64-x86_64-dlfcn
#
#  Ensure the following paths have been added to the PATH system environment variable:
#   C:\msys64\mingw64\bin, C:\msys64\ucrt64\bin, C:\msys64\usr\bin
#

[env:simulator_windows]
extends         = simulator_common
build_src_flags = ${simulator_common.build_src_flags} -fpermissive
build_flags     = ${simulator_common.build_flags} ${simulator_common.debug_build_flags}
                  -IC:\\msys64\\mingw64\\include\\SDL2 -fno-stack-protector -Wl,-subsystem,windows
                  -ldl -lmingw32 -lSDL2main -lSDL2 -lSDL2_net -lopengl32 -lssp
build_type      = debug

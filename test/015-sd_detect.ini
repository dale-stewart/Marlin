#
# A machine that can tell whether the card is actually in the slot.
#
# Every other configuration here has media without a card-detect line, and
# `CardReader::isSDCardInserted()` is then a constant:
#
#   #if HAS_SD_DETECT
#     READ(SD_DETECT_PIN) == SD_DETECT_STATE
#   #else
#     ENABLED(HAS_SDCARD)      // "No card detect line? Assume the card is inserted."
#   #endif
#
# With the predicate constant, `manage_media()` can never see a card arrive or leave. The
# state machine still runs on every idle pass — so it is covered — but nothing it decides
# can differ, and 66 of the 397 surviving mutants in `cardreader.cpp` were sitting in it.
# Not untested. Unreachable.
#
# The pin exists on this board only inside `#if ANY(TFT_COLOR_UI, TFT_CLASSIC_UI,
# TFT_LVGL_UI)` and in the LCD-controller blocks, so reaching it through a display option
# would drag in a whole UI stack — u8glib or the TFT tree, thousands of lines of vendored
# code — to test four branches in the media layer. Defining the pin directly is the smaller
# change and says plainly what it is for.
#
# 41 matches what the board's own TFT block uses. `SD_DETECT_STATE` defaults to LOW, and a
# simulated pin reads LOW at reset, so the card starts out present exactly as it does in
# every other configuration; what this adds is the ability to say otherwise.
#
# Note what is *not* here: `reinit_noisy_lcd = off`, which `004-sd_powerloss` needs because
# `Warnings.cpp` reports REINIT_NOISY_LCD as pointless on a board with no SD-detect pin, and
# these environments build with `-Werror`. With a detect pin the warning does not fire.
#
[config:base]
ini_use_config             = base

# Unit tests must use BOARD_SIMULATED to run natively in Linux
motherboard                = BOARD_SIMULATED

sdsupport                  = on

# The whole point of the configuration.
sd_detect_pin              = 41

# Required for the same reason as in 004: enabling media defines EVENT_GCODE_SD_ABORT as
# "G27", and SanityCheck.h asserts on it with a `strstr` that is only constant-folded at
# -O1 and above.
nozzle_park_feature        = on

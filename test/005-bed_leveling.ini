#
# Test configuration with a probe and automatic bed levelling
#
# The best ratio of behaviour to lines in the firmware: a probe sequence, a least-squares
# plane fit, and a coordinate transform applied to every move afterwards. It is also the
# only configuration that compiles `vector_3.cpp`, which Phase 1 had to defer for exactly
# that reason — matrix code with no caller is code no test can reach.
#
[config:base]
ini_use_config             = base

# Unit tests must use BOARD_SIMULATED to run natively in Linux
motherboard                = BOARD_SIMULATED

# A probe that is simply attached to the carriage: no servo, no sled, no docking sequence.
# The point is to reach the levelling maths, not to model a mechanism.
fix_mounted_probe          = on

# The planar fit, rather than the bilinear mesh. Both are worth covering eventually; this
# one first because it is the one that goes through `vector_3.cpp` — a plane through the
# probed points, and a rotation matrix applied to every subsequent move.
auto_bed_leveling_linear   = on

# Restore the levelling state after G28, so a homing move does not silently discard the
# plane a test just measured.
restore_leveling_after_g28 = on

# Homing Z anywhere but the middle of the bed can drive a probe off the edge, so the
# firmware warns unless Z is homed at a safe point. Real, and this env builds with -Werror.
z_safe_homing              = on
improve_homing_reliability   = on

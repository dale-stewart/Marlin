#
# The last consumers of the parser's global state.
#
# `GCodeParser` keeps its command number, its seen-flags and its string argument in static
# members that command implementations read directly. Removing that state is wanted, and the
# rule here is that a public surface does not change until its callers are covered - so the
# migration is blocked by whichever consumers no test can reach.
#
# Seven of them were reachable by no configuration at all, which reads in a coverage report
# exactly like seven files nobody bothered to test. It is not the same thing: an uncompiled
# file is a build problem, and no amount of test writing fixes it.
#
# One option per consumer, in the order they appear below:
#
#   configurable_machine_name   gcode/config/M550.cpp
#   cnc_coordinate_systems      gcode/geometry/G53-G59.cpp
#   expected_printer_check      gcode/host/M16.cpp
#   gcode_macros                gcode/feature/macro/M810-M819.cpp
#   long_filename_host_support  gcode/sd/M33.cpp
#   sdsupport                   ...which is what compiles the sd/ directory at all
#
# Note: these files take NO inline `#` comments after a value. The configuration script copies
# the rest of the line into the generated `#define`, and the build then fails somewhere else
# entirely - an em-dash in a comment here surfaced as "extended character is not valid in an
# identifier" in Configuration_adv.h.
#
# RS485 (`M485.cpp`) and the MMU3 driver are deliberately not here. Both were suspected of
# wanting hardware, and bundling them would make a failure ambiguous about which one caused it.
#
[config:base]
ini_use_config             = base
motherboard                = BOARD_SIMULATED

gcode_quoted_strings       = on
configurable_machine_name  = on
cnc_coordinate_systems     = on
expected_printer_check     = on
gcode_macros               = on
long_filename_host_support = on
sdsupport                  = on

# Required, not decorative - same trap 004 hit. Enabling media defines EVENT_GCODE_SD_ABORT
# as "G27", and SanityCheck asserts on it with a non-constexpr strstr, which cannot compile.
nozzle_park_feature        = on

# Auto-enabled with media, but BOARD_SIMULATED has no SD-detect pin, so Warnings.cpp
# reports it as unnecessary and this env builds with -Werror.
reinit_noisy_lcd           = off

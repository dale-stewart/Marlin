#
# A machine that homes Z to its maximum.
#
# Every other configuration here homes every axis to its minimum, which makes
# `home_dir(axis)` a constant -1 and `base_home_pos(axis)` a constant 0. Two consequences
# follow, and neither is obvious from a coverage report.
#
# The first is a dead branch. M428 measures the offset between where the tool is and the
# nearest reference point, and it has a correction for an axis that is past centre on a
# machine homing to maximum - `if (... && home_dir(i) > 0) diff[i] = -position[i]`. With
# every axis homing to minimum that condition can never hold, so the line is unreachable
# in every build here. The command's own comment says what it is for: "This allows the Z
# offset to be set near the bed when using a max endstop."
#
# The second is subtler and is why the branch could not be killed even by reaching it.
# With `base_home_pos` at 0 the general formula `base_home_pos(i) - position[i]` and the
# correction `-position[i]` are the same expression, so the correction is a no-op wherever
# it runs. Twenty-nine mutants of that guard survived every assertion for that one reason.
# Homing Z to maximum puts `Z_HOME_POS` at `Z_MAX_POS`, and the two expressions separate.
#
# That is the distinction this fork keeps returning to: not untested, unreachable. The fix
# is a configuration, not a test.
#
[config:base]
ini_use_config             = base
motherboard                = BOARD_SIMULATED

# Z homes upward, against a switch at the top of the axis.
z_home_dir                 = 1

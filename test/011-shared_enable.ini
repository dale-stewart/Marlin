#
# A board where two axes share one driver enable pin.
#
# Cheap printers do this: a driver's ENABLE line is a whole pin, and a board short of pins
# wires two of them together. The consequence is that the axes can no longer be powered
# independently - enabling X also energises Y, and releasing X alone is impossible while Y
# still needs holding.
#
# Marlin handles it, in `do_enable()` and `try_to_disable()` in M17_M18_M84.cpp: it tracks
# which axes came on as a side effect, warns about them, and refuses to report an axis as
# released when the shared pin is still driven. Together those are two thirds of that file,
# and **no configuration here compiled them into a reachable state**. `any_enable_overlap()`
# is a constexpr over the pin assignments and was false in every build, so the branch that
# calls them was dead and no test could reach it however hard the command was exercised.
#
# That is the distinction this fork keeps coming back to: not untested, unreachable. The fix
# is a configuration, not a test.
#
# `Y_ENABLE_PIN` is set to X's, which is what the pins file gives X. The enable pins in
# `native/pins_RAMPS_NATIVE.h` are wrapped in `#ifndef` so a configuration can do this; that
# is a change to the simulation board only, which is what a simulation board is for.
#
[config:base]
ini_use_config             = base
motherboard                = BOARD_SIMULATED

# X and Y on one driver enable line. 38 is X_ENABLE_PIN in native/pins_RAMPS_NATIVE.h.
y_enable_pin               = 38

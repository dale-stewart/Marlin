#
# A machine that defers the temperature-error kill instead of taking it immediately.
#
# `Temperature::_temp_error()` normally ends in `loud_kill()` -> `Marlin::kill()`, whose last
# act is a spin waiting for an operator to press a button. It does not return. That is correct
# for a printer and it is why register #19 has stood: the MINTEMP and MAXTEMP checks in
# `updateTemperaturesFromRawValues()` can be reached by a test but never asserted after, so
# their mutants are detectable only by hanging. Sixty-three survivors sit there.
#
# `BOGUS_TEMPERATURE_GRACE_PERIOD` is Marlin's own answer to a related problem: the sensors are
# unreliable for a moment after power-on, so a board can ask for temperature errors in that
# window to disable the heaters and *return* rather than kill. That is exactly the seam #19
# asks for, and it already exists — no production change is needed to get it.
#
# The period here covers the whole run rather than the usual couple of seconds, which is
# honest rather than a dodge: a unit-test binary boots once and lives for a few simulated
# minutes, so "the machine is still starting up" is true for its entire life. What the option
# does not defer is the safety action itself. `_temp_error()` calls `disable_all_heaters()`
# unconditionally, before the grace-period decision, so this build still shuts every heater
# off the instant a sensor goes out of range — and that is the behaviour the tests assert.
#
# Be clear about what this configuration is: unlike `011-shared_enable` and `012-max_endstops`,
# which model real printers, this one models a printer with its kill deferred. The killing path
# stays untested and stays recorded as #19; what becomes testable is the *detection*, which is
# the half that decides whether the heaters are ever switched off at all.
#
[config:base]
ini_use_config             = base
motherboard                = BOARD_SIMULATED

# Longer than any test run's simulated time, so the deferral holds for the whole process.
# `_temp_error` counts: the first error arms an expiry, the second promotes only once that
# expiry has passed, and the third kills. Nothing here advances the clock by an hour.
bogus_temperature_grace_period = 3600000

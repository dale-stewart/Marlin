#
# I2C position encoders.
#
# Closed-loop position feedback: a magnetic encoder on each axis, read over I2C, telling the
# firmware where the carriage *actually* is rather than where it believes it is.
#
# It exists as a configuration because `feature/encoder_i2c.cpp` could not be built for the host
# at all until `HAL/TEST/include/Wire.h` — Arduino's I2C API is not available off-target, so the
# file was compiled by nothing and tested by nothing. It also writes `axis_steps_per_mm`
# directly, which is one of the consumers holding that field public.
#
[config:base]
ini_use_config             = base
motherboard                = BOARD_SIMULATED
i2c_position_encoders      = on
babystepping               = on
babystep_xy                = on

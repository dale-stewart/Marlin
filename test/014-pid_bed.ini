#
# A machine whose bed is regulated rather than switched, so `M303 E-1` can tune it.
#
# `PID_autotune()` is one function serving three heaters, and which heater it is serving
# changes the constants it uses:
#
#     const millis_t relay_delay = (isbed || ischamber) ? 5000UL : 3000UL;
#     pf = (ischamber || isbed) ? 0.2f      : 0.6f,
#     df = (ischamber || isbed) ? 1.0f/3.0f : 1.0f/8.0f;
#
# With `PIDTEMPBED` off — which was every other configuration here — `isbed` is a
# compile-time false and every one of those true arms is unreachable. Not untested:
# unreachable. Forty-seven mutants across eleven lines survived for that one reason,
# thirteen of them on the `df` line alone. The same goes for the `PER_CBH(...)` and
# `PER_WATCH_CBH(...)` selectors, which choose the chamber, bed or hotend value for the
# power limit, the maximum target and the heat-up watchdog.
#
# The difference is physical rather than cosmetic: a bed has far more thermal mass, so it
# is held at each relay level for five seconds instead of three and given the conservative
# Ziegler-Nichols factors. Tune a bed with the hotend's numbers and it oscillates around
# its target for the whole print.
#
# ---------------------------------------------------------------------------------------
# The gains below are the point of this file, and they are not the shipped defaults.
#
# Marlin ships `Kp 10, Ki 0.023, Kd 305.4` for the bed, derived from an FOPDT model of a
# real 120 V 250 W silicone heater with `Tp = 405` seconds. `SimulatedBed` is a different
# plant: 110 C at full power with a 120-second time constant. Two mismatches follow, and
# both were measured rather than guessed, by tracing the bed's temperature and duty cycle
# under the shipped gains:
#
#   * `Ki` is applied *per call*, not per second, and `Temperature::task()` returns early
#     until a full oversampled ADC set is ready — so the bed PID runs about three times a
#     second here. At `Ki 0.023` the integral term needs roughly 150 seconds to wind up to
#     the ~41% duty that holds 60 C, and the bed creeps: 100 seconds in it had reached
#     50.2 C and was gaining 0.1 C/s.
#   * `Kd 305.4` at that call rate brakes hard on every rise, which is what collapsed the
#     duty cycle from full power to 45% the moment the error came inside
#     `PID_FUNCTIONAL_RANGE`.
#
# The result was that `M190` never returned and the suite hung 528 tests in — under a HAL
# where the test owns the clock, "slow" and "never" are the same symptom.
#
# These gains reach 60 C in about 65 seconds, which is the plant's own limit (a 120-second
# time constant towards 110 C cannot do better), and settle at 60.4 C with no overshoot at
# all — which matters, because any excursion past `TEMP_BED_HYSTERESIS` restarts `M190`'s
# residency timer.
#
# A test configuration stating its own tuning is the same move `SimulatedMachine` already
# makes for steps-per-millimetre and feedrates: the fixture describes the machine it is,
# not the machine the defaults were written for.
# ---------------------------------------------------------------------------------------
#
# Chamber tuning stays dark. `PIDTEMPCHAMBER` needs a heated chamber, which is a different
# machine rather than a different control mode, and the `ischamber` half of those same
# ternaries is still unreachable. Worth knowing before reading a figure from this
# configuration as though it covered all three heaters.
#
[config:base]
ini_use_config             = base
motherboard                = BOARD_SIMULATED

# The bed is regulated rather than switched on and off at a threshold.
pidtempbed                 = on

# Matched to SimulatedBed (110 C at full power, 120 s time constant), not to a real bed.
default_bed_kp             = 15.0
default_bed_ki             = 0.20
default_bed_kd             = 60.0

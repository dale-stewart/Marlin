#
# Persistent settings.
#
# `settings.cpp` is the file that writes `planner.settings` — and everything else the user can
# change — to storage and reads it back. None of the other configurations here enable
# `EEPROM_SETTINGS`, so `M500` and `M501` are not compiled at all and the only part of that file
# any test could reach was `reset()`.
#
# The test HAL backs the store with a file (`Marlin/src/HAL/TEST/eeprom.cpp`), so the round trip
# is real: the bytes go out and come back.
#
[config:base]
ini_use_config             = base
motherboard                = BOARD_SIMULATED
eeprom_settings            = on
eeprom_chitchat            = on
